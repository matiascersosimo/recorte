<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recorte</title></head>
<body>
<header><div class="brand"><i aria-hidden="true"></i>Recorte</div><span class="local">Procesamiento local</span></header>
<main>
<section class="studio" aria-labelledby="title">
  <div class="toolbar"><div><h1 id="title">Mesa de recorte</h1><p id="filename">PNG, JPG o WebP</p></div><button id="open" class="secondary">Abrir imagen <b aria-hidden="true">↗</b></button></div>
  <div id="drop" class="drop">
    <div id="empty" class="empty">
      <div class="print" aria-hidden="true"><img src="/src/assets/astronaut.webp" alt=""></div>
      <div class="empty-text"><strong>Arrastrá tu foto acá</strong><p>o usá el botón Abrir imagen</p></div>
    </div>
    <div id="comparison" class="comparison" hidden>
      <img id="before" alt="Foto original"><div id="output-layer" hidden><img id="after" alt="Foto con fondo transparente"></div>
      <canvas id="edges" hidden aria-hidden="true"></canvas>
      <span class="tag left" id="left-tag">Original</span><span class="tag right" id="right-tag" hidden>Recorte</span>
      <div class="divider" id="divider" hidden><span>‹ ›</span></div>
      <input id="split" hidden type="range" min="0" max="100" value="50" aria-label="Comparar original y recorte">
    </div>
  </div>
  <div id="progress-panel" class="progress-panel" hidden><div><span id="progress-label"></span><span id="progress-value"></span></div><progress id="progress" aria-labelledby="progress-label" max="100"></progress></div>
  <div class="actions"><p id="status" role="status" aria-live="polite"></p><div><button id="run" disabled>Quitar fondo</button><button id="save" class="secondary" disabled>Exportar PNG <b aria-hidden="true">↓</b></button></div></div>
</section>
<aside aria-labelledby="model-title"><h2 id="model-title">Modelo de recorte</h2><div id="models"></div><section class="hardware"><h2>Tu equipo</h2><p id="hardware">Detectando hardware…</p><p id="recommendation"></p></section></aside>
</main><script type="module" src="/src/main.js"></script></body></html>
